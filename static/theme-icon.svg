    <rect x="6"  y="22" width="12" height="36"/>
    <rect x="22" y="12" width="12" height="46"/>
    <rect x="38" y="30" width="10" height="28"/>
    <rect x="50" y="20" width="10" height="38"/>
  </g>
  <!-- lit windows -->
  <g fill="#f5a623">
    <rect x="9"  y="26" width="2.5" height="2.5"/><rect x="13.5" y="26" width="2.5" height="2.5"/>
    <rect x="9"  y="32" width="2.5" height="2.5"/><rect x="13.5" y="38" width="2.5" height="2.5"/>
    <rect x="25" y="16" width="2.5" height="2.5"/><rect x="29.5" y="16" width="2.5" height="2.5"/>
    <rect x="25" y="22" width="2.5" height="2.5"/><rect x="29.5" y="28" width="2.5" height="2.5"/>
    <rect x="25" y="34" width="2.5" height="2.5"/><rect x="29.5" y="40" width="2.5" height="2.5"/>
    <rect x="41" y="34" width="2.5" height="2.5"/><rect x="41" y="40" width="2.5" height="2.5"/>
    <rect x="53" y="24" width="2.5" height="2.5"/><rect x="53" y="30" width="2.5" height="2.5"/>
    <rect x="53" y="36" width="2.5" height="2.5"/>
  </g>
  <!-- ground line -->
  <rect x="2" y="58" width="60" height="3" fill="#39c0c8"/>
</svg>
